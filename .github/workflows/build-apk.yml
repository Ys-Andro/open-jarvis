name: Build Open Jarvis APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e
          gradle --no-daemon wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Verify build environment
        shell: bash
        run: |
          set -e
          java -version
          ./gradlew --version
          sdkmanager --list_installed | grep -E "platforms;android-34|build-tools;34.0.0|platform-tools"

      - name: Clean project
        run: ./gradlew --no-daemon clean

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK generado correctamente:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
